<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    The arch mark as an app icon (design.md v3.0 §6; construction in
    src/components/layout/wordmark.tsx — the path below is copied from
    PlazaMark verbatim, base OPEN on purpose).

    Ink #1A1310 on an apricot #FF6A3D rounded square: apricot grounds take
    ink only (white fails at 2.85:1; ink passes at 6.45:1), and the apricot
    tile carries its own ground so the icon survives both light and dark
    browser chrome. No text — unreadable at 16px.
  -->
  <rect width="64" height="64" rx="14" fill="#FF6A3D"/>
  <!--
    The nested viewBox reproduces PlazaMark's clip exactly: the round line
    caps at the base extend past y=23 and are trimmed flat, so the doorway
    stays open with squared feet, just like the component renders.
  -->
  <svg x="12.87" y="10" width="38.26" height="44" viewBox="0 0 20 23">
    <path d="M2.6 22V10.4a7.4 7.4 0 0 1 14.8 0V22" fill="none" stroke="#1A1310" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="10" cy="14.6" r="2.9" fill="#1A1310"/>
  </svg>
</svg>
